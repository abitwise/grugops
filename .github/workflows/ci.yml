# grugops CI — vitest suite + freshness/build gates on an OS matrix.
#
# Created in Phase 20 plan 20-04 (SC-2 Windows proof). RESEARCH flagged a CI workflow as
# [ASSUMED] to exist — it did NOT. This file is created honestly; it does not fake any result.
#
# The windows-latest leg exists for ONE specific reason: to EXECUTE the SC-2
# `unlinkSync`-then-`renameSync` branch in scripts/context-io.ts on a real Windows runner
# (Windows MoveFileEx is not atomic and rejects rename-onto-existing with EPERM/EEXIST/EACCES;
# that branch only runs on Windows). The deterministic unit test in scripts/context-io.test.ts
# carries the logic proof on every OS; this matrix makes the cross-platform claim real, not asserted.
#
# HONESTY CARVE-OUT (no fabrication): a GREEN windows-latest run proves the Windows code branch
# executes and the concurrent-writer/render tests pass on Windows. It does NOT prove atomicity over
# a true network filesystem (NFS/SMB) — that is `UNKNOWN - verify` and is intentionally NOT claimed
# here. The real concurrency oracle is DOGF-02 (Phase 26). Do not read Windows-green as NFS-green.
#
# Node 22 is the documented hard floor (CLAUDE.md / package.json engines `>=22`). The committed
# package-lock.json makes `npm ci` deterministic. Dev deps are typescript/vitest/@types/node only
# (already audited) — this workflow installs NO new package.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # FULL HISTORY IS REQUIRED BY guard_diff_disposition (LANG-03 / plan 29-04), NOT AN
          # UNEXPLAINED SLOWDOWN. That gate resolves the base commit recorded in
          # docs/audit/29-style-dispositions/00-base.md and takes its diff against it. The default
          # shallow checkout fetches ONE commit, which makes that SHA unreachable — and the gate
          # fails CLOSED on an unresolvable base, so a shallow clone would turn it red on every CI
          # run for a reason that has nothing to do with the kit's prose. Removing this setting does
          # not make the gate faster; it makes it permanently red.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (dev deps only — typescript/vitest/@types/node)
        run: npm ci

      # ── D-57: the build-output gate runs BEFORE anything can rewrite its subject. ─────────────
      #
      # WHAT THIS STEP IS, AND WHAT IT IS NOT. It is the SECOND, INDEPENDENT mechanism. It is NOT
      # the reason the gate works. scripts/freshness.ts reads its committed side with
      # `git show HEAD:<path>` and derives its compared set from `git ls-tree -r HEAD`, so a build
      # step running earlier in the same job rewrites the working tree — which is not that gate's
      # subject — and has nothing to repair. The gate is ordering-independent by construction.
      #
      # WHY THE ORDERING IS PINNED ANYWAY. Until plan 29-59 the gate read the working tree, and
      # `tsconfig.json` sets outDir/rootDir to "./", so `npm run build` rewrote the tracked .js in
      # place. Running the build first therefore made the gate compare a rebuild against a rebuild:
      # it could not detect a committed .js that was hand-edited or never rebuilt, which is the
      # exact guarantee CLAUDE.md's tech-stack section gives as the whole reason the tooling layer
      # ships as committed .js. That state lasted from Phase 20 to Phase 29 while every run was
      # green. Pinning the order costs seconds and removes a whole class of future reordering risk.
      #
      # Ubuntu-scoped for the same reason as the later freshness block: path-separator and
      # line-ending surface, with Windows kept to the SC-2 atomicity proof.
      - name: Freshness gate before any build (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run freshness

      # ── THREE DIFFERENT THINGS HOLD THE COMMITTED-.js CONTRACT. THEY ARE NOT INTERCHANGEABLE. ──
      #
      #   the freshness gate   holds that the .js committed AT HEAD is a build of the .ts committed
      #                        beside it. Its subject is HEAD; no step here can repair it.
      #   the parity script    holds that the WORKING TREE does not move when tsc runs. Its subject
      #                        is this checkout. `npm run check:build-parity` in package.json is the
      #                        ONE authority for that assertion; this workflow CALLS it and never
      #                        restates it, because a copy of an assertion in a workflow is a second
      #                        authority over one predicate.
      #   the build            compiles. That is all it does. This step used to be named for the
      #                        parity claim, which is why the claim went unheld for nine phases.
      #
      # THE OS-SCOPING DECISION, STATED RATHER THAN LEFT TO DEFAULT. The parity assertion runs on
      # ubuntu ONLY. Two reasons, both about the oracle rather than about the code: a raw diff over
      # emitted files on a Windows checkout is an unreliable oracle for line-ending reasons (the
      # same family the later freshness block is scoped for), and the script's pathspec is a
      # POSIX-shell construct that cmd.exe would pass through unquoted, which would make the
      # assertion silently match nothing. A vacuous green is worse than an absent check, so the
      # Windows leg compiles and says so, and this comment is where a reader learns which legs
      # assert parity and why.
      - name: Build and working-tree parity assertion (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:build-parity

      - name: Build (every other leg — a compile; parity is asserted on ubuntu, see above)
        if: matrix.os != 'ubuntu-latest'
        run: npm run build

      # (27-60 / WR-04) WIRED HONESTLY, AND THE FINDING IS THAT IT WAS NOT WIRED AT ALL.
      # 27-REVIEW § WR-04 proposed wiring the new test-inclusive target "into the same gate that
      # runs typecheck". There WAS no typecheck step in this workflow — the shipped source got
      # type-checked only as a side effect of `npm run build` (tsc with noEmitOnError), and the
      # TEST files got type-checked by nothing anywhere: tsconfig.json excludes `**/*.test.ts`
      # (measured: `tsc --noEmit --listFiles` loaded ZERO of the 36 tracked .test.ts files) and
      # vitest's transform strips types without checking them.
      #
      # `npm run typecheck` now runs BOTH targets: the shipped-source one (unchanged, exclude list
      # byte-identical) and tsconfig.tests.json, which drops only the test exclusion. It emits
      # nothing, so it cannot perturb the committed .js the freshness gate compares against.
      # Both OS legs run it; it is pure type analysis with no path-separator surface.
      - name: Typecheck (shipped source + test-inclusive target)
        run: npm run typecheck

      # Run the full vitest suite EXCLUDING the live claude-CLI e2e lane (scripts/e2e). That lane
      # spends tokens and can hang on an authed box; it is NOT a CI gate. On windows-latest this is
      # the step that exercises the SC-2 unlink-then-rename branch (paths normalized via node:path).
      - name: Vitest (e2e lane excluded)
        run: npx vitest run --exclude '**/scripts/e2e/**'

      # ubuntu-only: the four freshness gates + the three repo gates. Scoped to one OS to avoid
      # path-separator drift in the freshness diffs; Windows stays scoped to the atomicity proof.
      - name: Freshness gates + repo gates (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run freshness
          npm run freshness:catalog
          npm run freshness:context
          # SPAWN-02 — the gate that makes a hand-edited .claude/agents adapter unrepresentable.
          # It existed and passed for a whole phase while being invoked by nothing, so a committed
          # hand-edit to an adapter cleared every gate in the repository (27-REVIEW CR-01/CR-02).
          npm run freshness:adapters
          # KIT-03 / SPAWN-04 (plan 27-64, D-64 Part B) — the same mechanism, extended to the
          # surface that kept failing. Every bypass reproduced in eleven review rounds landed in a
          # SKILL.md; the seventeen generated-and-byte-gated agent adapters were never bypassed
          # once. The seven standalone skill twins are now generated and byte-gated too, so a
          # hand-edit to one is unrepresentable in a green build. Wired HERE and in
          # scripts/skill-twins-freshness.test.ts, deliberately at both ends — freshness:adapters
          # was un-wired for a whole phase and that was this phase's most expensive omission.
          npm run freshness:skill-twins
          # MODEL-03 / MODEL-05 (plan 29.1-09, WR-07) — THE REFUSALS THIS PHASE BUILT WERE UNREACHABLE
          # FROM THE BUILD, and the three lines below are the half of the fix no source edit can hold.
          #
          # Three facts composed into a fail-open, and the composition was reproduced end to end: an
          # illegal `models` block committed to a mirror cleared BOTH gates in this block at exit 0.
          # (1) guard_model_assignment reported a refused configuration through the ADVISORY channel,
          # which does not fail a build — closed in the guard itself by the same plan. (2) the
          # adapters-freshness mirror copies the role and packaging trees and NO configuration, so the
          # mirrored generator never opened the offending file. (3) the adapter generator is the ONE
          # process that refuses an illegal `models` block, and this workflow ran it nowhere:
          # `generate:adapters` was defined in package.json and invoked by no step here.
          #
          # THE CLEANLINESS PAIR BUYS A SECOND PROPERTY, and it is not obvious from the commands.
          # Beyond letting the generator's refusal fail the build, it asserts the adapter directory is
          # clean against the INDEX **and** against the FILESYSTEM after the generator has run — so a
          # generated adapter that was never committed is caught here as well as a hand-edited or stale
          # one, on the configuration axis rather than the byte-mirror axis freshness:adapters covers.
          #
          # THE PAIR REPLACES A `git diff --exit-code` OVER THIS PATHSPEC (R2-IN-05, plan 29.1-14).
          # That command could not see an UNTRACKED adapter: git diff ignores untracked files, so an
          # adapter the generator creates that was never committed left it empty at exit 0. Measured on
          # this tree with one throwaway file planted in the directory — the replaced command printed
          # nothing and exited 0; the pair below prints `?? .claude/agents/<file>` and exits 1. The
          # replaced command's literal is deliberately NOT written out anywhere in this file, so a
          # grep for it reports zero and the pin below cannot be satisfied by this paragraph.
          #
          # TWO LINES RATHER THAN ONE, ON PURPOSE. The first PRINTS the offending entries and the
          # second ASSERTS there are none. A bare emptiness assertion fails with no output, which is a
          # gate the failing operator cannot act on.
          #
          # Wired HERE and in scripts/check-foundation-guards.test.ts, deliberately at both ends. This
          # block's own comment above already records that freshness:adapters sat un-invoked for a whole
          # phase; this is the second time that lesson is applied to this same block.
          npm run generate:adapters
          git status --porcelain -- .claude/agents/
          test -z "$(git status --porcelain -- .claude/agents/)"
          node scripts/check-foundation-guards.js
          # IN-02 (plan 27-23) — WIRED AT BOTH ENDS. Until this line, check-kit-refs and
          # validate-agent-factory ran in continuous integration solely as a SIDE EFFECT of their
          # .test.ts files spawning them inside the vitest step above. That is one --exclude pattern
          # away from being un-gated, and it is exactly the state freshness:adapters was in before
          # plan 27-11 wired it here — minus the missing test, which these two do have. A gate that
          # runs only because some other step happens to run it is not wired; it is borrowed.
          #
          # THE FINDING IS PRE-EXISTING and was scoped into plan 27-23 deliberately. It is not repair
          # of a regression that plan introduced — a later reader should not read these two lines as
          # a fix for something the same diff broke.
          #
          # ROOTS: check-kit-refs resolves its root correctly from the repository root, where this
          # workflow runs (CHECK_ROOT is an override for hermetic mirrors, never a requirement), so
          # it is invoked bare. validate-agent-factory deliberately has NO default for its KIT root
          # — the C3 no-false-green guard makes an unset VALIDATE_KIT_ROOT a hard error rather than a
          # silent '.' fallback — so the value is supplied explicitly here. VALIDATE_ROOT is left
          # unset on purpose and falls back to the repository root, which is the state root of this
          # single-tree checkout.
          node scripts/check-kit-refs.js
          # AUDIT-02 (plan 28-01, D-09) — the THIRD consumer of scripts/dead-vocabulary.ts, sitting
          # beside check-kit-refs on purpose so a reader meets the two consumers of the one
          # retired-vocabulary authority as a pair. check-kit-refs's SCAN deliberately EXCLUDES the
          # user-visible public documents (root README.md, CLAUDE.md, examples/,
          # agent-factory/README.md) under its never-a-repo-wide-grep contract; this gate covers
          # exactly that surface, with its own derived and two-sided-pinned scan set. That contract
          # is untouched — no entry was added to or removed from SCAN or GH_SCAN.
          #
          # WIRED HERE **AND** IN scripts/check-public-docs-vocabulary.test.ts, DELIBERATELY AT BOTH
          # ENDS. This repository shipped freshness:adapters for an entire phase while it ran solely
          # as a side effect of a test spawning it — one --exclude pattern away from being un-gated.
          # A gate that runs only because some other step happens to run it is not wired; it is
          # borrowed.
          #
          # WHAT IT HOLDS, AND WHAT A RED MEANS. It asserts that the ten scanned public documents
          # carry ZERO retired grugops vocabulary, reading the literals from the one authority in
          # scripts/dead-vocabulary.ts. A red here means a document reintroduced a retired path form
          # or a retired prose form — most likely a v1.x description of the deleted handoff relay
          # written back into text a user reads. Fix the DOCUMENT. Do not add an exemption and do not
          # narrow the scan set: PUBLIC_DOCS_SCAN_COUNT is two-sided pinned precisely so removing a
          # member to reach green is not available.
          #
          # It was landed RED on purpose (D-24) and turned GREEN by plan 28-05 — exit 1 with 18 hits
          # across 8 of 10 documents at the commit that introduced it, exit 0 after, with the gate
          # itself byte-unchanged across the transition. That history is why a red here is credible:
          # this guard has been watched catching the exact drift it exists for.
          node scripts/check-public-docs-vocabulary.js
          # AUDIT-01 (plan 28-03, D-03 / D-05) — the disposition-register completeness gate. It
          # sits after the drift guard because both are Phase 28 audit gates and a reader should
          # meet them together, and because this one is the slower of the two to reason about.
          #
          # WHY THIS IS A CHECK AND NOT A CLAIM. Phase 29 declares a dependency on
          # docs/audit/28-disposition-register.md, and a .planning/phases/28-.../ artifact is
          # ARCHIVED at milestone close and invisible to CI — so "the register is complete" written
          # in a planning document is a sentence that stops being true without anything going red.
          # The register is a durable docs/ artifact and this gate holds its completeness here.
          #
          # WIRED HERE **AND** IN scripts/check-audit-register.test.ts, DELIBERATELY AT BOTH ENDS,
          # for the same reason recorded above the public-docs gate: freshness:adapters ran for an
          # entire phase solely as a side effect of a test spawning it.
          #
          # WHAT IT HOLDS, AND WHAT A RED MEANS. Three things, on every run. (1) Every file the
          # derived listers return has a register row, by SET equality in both directions — a red
          # here means a role or workflow was added, removed or renamed without its row, or a row
          # names a file that no longer exists. (2) The findings each row DECLARES equals the Table B
          # rows naming it, per file and in total — a red means a finding was added or deleted
          # without its count. (3) The derived D-18 exclusion list at
          # docs/audit/28-safety-surface-exclusions.md is byte-identical to a fresh regeneration — a
          # red means a `safety_surface` flag or a `kind: safety` claim moved and the list was not
          # rebuilt; run `npm run generate:safety-surface` and commit the result. It also refuses a
          # blank observation, a bare-word observation, a disposition outside the closed set, a
          # deferral with no target phase and a category-6 finding disposed as anything but
          # deferred-to-29.
          #
          # It was landed RED on purpose (D-05, the same argument D-24 makes about the drift guard
          # above) and turned GREEN by the read pass in plans 28-06 and 28-07 — exit 1 with
          # `2 CHECK(S) FAILED` over 37 blank observations at the commit that introduced it, exit 0
          # once all 37 rows were filled. BOTH D-03 equalities were already green at that commit, so
          # the red was precisely the unread files and nothing else. Nothing was loosened and no row
          # was dropped to reach green; the register was filled.
          node scripts/check-audit-register.js
          # AUDIT-03 (plan 28-04, D-16) — the claim-registry anchor gate, third and last of this
          # phase's audit gates, sitting after the register gate so a reader meets all three
          # together.
          #
          # WHAT IT HOLDS. docs/audit/28-claim-registry.md maps every public claim to the safety
          # floor whose lowering would falsify it, and its only consumer is Phase 30's
          # claim-dropping, which voids claims BY ID. PHASE 29 SITS BETWEEN THE TWO AND REWRITES
          # PROSE FOR A LIVING. Without this gate a Phase 29 rewrite silently invalidates the
          # registry: the rows keep parsing, the ids keep resolving, and every one of them points
          # at a sentence that moved or changed. This asserts anchors and rows are a bijection and
          # that each row's text is byte-identical at its anchor.
          #
          # WIRED HERE **AND** IN scripts/check-claim-anchors.test.ts, DELIBERATELY AT BOTH ENDS,
          # for the same reason recorded above the two gates before it: freshness:adapters ran for
          # an entire phase solely as a side effect of a test spawning it.
          #
          # UNLIKE THE OTHER TWO PHASE 28 GATES, THIS ONE IS EXPECTED **GREEN** ON LANDING — the
          # registry was authored against today's text, so there is nothing for it to catch yet.
          # Measured at the commit that introduced it: exit 0, 38 registry rows (37 markdown, 1
          # unanchorable), 37 verbatim comparisons, all 4 safety floors mapped.
          #
          # IT IS EXPECTED TO GO **RED INSIDE PLAN 28-05** if that plan rewrites an anchored
          # sentence without updating its row in the same commit. That is not breakage; it is the
          # mechanism D-25 relies on, demonstrated on a real commit rather than on a fixture. Six
          # rows ship `status: false` and eight ship `status: overstated` precisely so that trail
          # exists.
          node scripts/check-claim-anchors.js
          # LANG-04 (plan 29-02, D-29 / D-44) — the banned-claim gate. It sits beside the claim
          # anchors on purpose: the registry holds that a REGISTERED claim has not moved, and this
          # gate holds that a FORBIDDEN claim never appears. Two different questions about the same
          # public surface, and neither substitutes for the other.
          #
          # WIRED HERE **AND** IN scripts/check-banned-claims.test.ts AND IN package.json,
          # deliberately at all the ends it has. This repository shipped freshness:adapters for an
          # entire phase while it ran solely as a side effect of a test spawning it — one --exclude
          # pattern away from being un-gated. A gate that runs only because some other step happens
          # to run it is not wired; it is borrowed.
          #
          # WHAT IT HOLDS, AND WHAT A RED MEANS. It asserts that the kit's scanned text surface —
          # the kit's markdown documents PLUS the kit's shipped plugin manifests, derived in six
          # named parts, deduped, and pinned two-sided — carries ZERO controlled-language
          # conformance claim, ZERO token-economy win claim and ZERO comprehension-benefit claim,
          # outside ONE named exemption region: the `## Disclaimer and honesty floor` section of
          # agent-factory/writing-profile.md, which has to be able to name a claim in order to deny
          # it. That region is bounded in POSITION and in CONTENT (round 7, D-54): a line inside it
          # is exempt only while it also sits inside a registry-anchored block whose bytes are
          # byte-identical to the row naming them in docs/audit/28-claim-registry.md, so a claim
          # substituted for a denial inside the carve-out is a finding rather than a silent swap.
          # A red means a document asserts something this project has no evidence for, or claims
          # conformance with a standard that publishes outright that it endorses and certifies no
          # tool.
          #
          # NO DOCUMENT COUNT IS STATED HERE, DELIBERATELY. This comment carried a corpus size, and
          # it was stale on BOTH of the two occasions a plan widened the scan — so a third value
          # typed at this address would be the construct being wrong rather than the value, and it
          # would be stale again on the next widening. The count lives in BANNED_CLAIM_SCAN_COUNT in
          # scripts/check-banned-claims.ts, where it is pinned two-sided and reds the moment the
          # derivation disagrees with it. A name does not rot; it points at a value something else
          # already asserts in both directions. The dated, commit-attributed record below is a
          # different thing and stays: it reports what one named commit measured, in the past tense.
          #
          # FIX THE DOCUMENT. Delete the claim. Do NOT add an exemption — there is exactly one and
          # it is asserted two-sided, so a duplicated region is itself a red — and do NOT narrow the
          # scan set: BANNED_CLAIM_SCAN_COUNT is two-sided pinned precisely so removing a member to
          # reach green is not available.
          #
          # IT WAS LANDED RED ON PURPOSE (D-44) AND AGAINST THE REAL TREE. Because the standard's
          # name appeared in ZERO kit files, a check landed against this tree would have gone green
          # having never been watched fail — so plan 29-02 wrote one deliberate conformance sentence
          # into the profile first. At commit 20982a0 the gate exited 1 with 3 findings over 82
          # documents; at 0fafbaf it exits 0, with the gate itself byte-unchanged across the
          # transition. TWO of those three findings were NOT planted: the kit already claimed the
          # caveman voice is a token economy, which project measurement disproved on this artifact.
          # That is why a red here is credible — this guard caught real drift on its first run.
          node scripts/check-banned-claims.js
          # LANG-01 / LANG-02 / LANG-04 (plan 29-03, D-12 / D-35 / D-36 / D-39 / D-40 / D-42) — the
          # controlled-language gate. It sits directly after the banned-claim gate because the two
          # halves of LANG-04 belong together: that one holds that the kit CLAIMS no conformance,
          # and this one holds the small decidable subset the kit actually DOES check. Two named
          # predicates ship in one module — `guard_imperative_lexicon` for the verb-at-imperative-
          # position rule and `guard_sentence_form` for sentence length and banned constructions —
          # because naming one guard for three unrelated predicates re-creates the
          # `guard_caveman_preserved` defect at the output line.
          #
          # WIRED HERE **AND** IN scripts/check-imperative-lexicon.test.ts AND IN package.json,
          # deliberately at all the ends it has. This repository shipped freshness:adapters for an
          # entire phase while it ran solely as a side effect of a test spawning it — one --exclude
          # pattern away from being un-gated. A gate that runs only because some other step happens
          # to run it is not wired; it is borrowed.
          #
          # WHAT IT HOLDS, AND WHAT A RED MEANS. Over a corpus DERIVED in four named parts — 19
          # workflows, 13 hand-authored checklists, 13 seed templates, 2 contracts, 47 in total —
          # it asserts that every `## Steps` bullet begins with a verb from a closed 43-member set
          # at position zero, and that every sentence is inside the bound its section anchor selects
          # (20 words procedural, 25 descriptive) and carries none of four banned constructions. A
          # red names a file, a line, the offending token and the `WP-NN` rule id from
          # agent-factory/writing-profile.md.
          #
          # FIX THE DOCUMENT. Do NOT add an exemption and do NOT narrow the scan set:
          # GOVERNED_CORPUS_COUNT is two-sided pinned, and so is the derived `GENERATED`-marker
          # exclusion, precisely so removing a member to reach green is not available. Do NOT widen
          # APPROVED_STEP_VERBS to admit a token the corpus does not already use as a bare
          # imperative — the list is a declared canonical form, not a frequency cutoff, and its
          # admission test is written above the array.
          #
          # IT WAS LANDED RED ON PURPOSE (D-24) AND AGAINST THE REAL TREE: exit 1 with 81 findings
          # over 125 `## Steps` bullets and 264 findings over 1,816 sentences at the commit that
          # introduced it. Plans 29-08 through 29-12 land the corpus rewrites that turn both
          # predicates green. A red here before those land is the acceptance evidence, not a
          # regression — and the clean-mirror GREEN control in the test file is what proves the
          # gate is not merely always red.
          node scripts/check-imperative-lexicon.js

          # ── LANG-03 / plan 29-04: guard_diff_disposition ──────────────────────────────────────
          #
          # WIRED HERE **AND** IN scripts/check-diff-disposition.test.ts AND IN package.json,
          # deliberately at all the ends it has. This repository shipped freshness:adapters for an
          # entire phase while it ran solely as a side effect of a test spawning it — one --exclude
          # pattern away from being un-gated. A gate that runs only because some other step happens
          # to run it is not wired; it is borrowed.
          #
          # WHAT IT HOLDS. Phase 28's safety-surface exclusion list names 41 files and says no text
          # in a listed file is reworded by a style pass — and those 41 files are the whole corpus
          # Phase 29 rewrites. The flag is per FILE and the real question is per SENTENCE, so this
          # gate supplies the granularity the column could not: it derives what is FROZEN from three
          # gates that already exist (the claim registry's verbatim anchors, the structural sections
          # located by heading, and the wording two guards require present), enumerates every clause
          # the diff CHANGED against the recorded base, and requires each one to be dispositioned.
          # One side is derived from the filesystem and the other from git, so neither can go stale.
          #
          # WHAT A RED MEANS, AND WHICH FIX IS NOT ALLOWED. A red names a file, a line, the
          # normalized clause and — when it is frozen — which source froze it and which companion
          # edit is owed. Write the disposition row under docs/audit/29-style-dispositions/, or make
          # the companion edit in the SAME commit. Do NOT add an override tier: there is none by
          # design, and adding one later would mean auditing every change already admitted under the
          # strict rule to find which would have taken the hatch. Do NOT narrow the watched corpus
          # and do NOT move the recorded base commit forward — both clear the finding by deleting
          # its evidence.
          #
          # THE ONE THING A READER WILL GET WRONG. This gate exiting 0 today does NOT mean it has
          # never been watched fail. It means the watched corpus has no change since the recorded
          # base — the gate says so in its own PASS line, which reports a clean tree rather than a
          # pass. Its RED evidence necessarily comes from a PLANTED REPOSITORY rather than from
          # today's clean tree, because the predicate reads a diff and today's diff is empty. Both
          # reproductions are PERMANENT CASES in the test file, not a historical commit: a reworded
          # role `## Hard limits` sentence with no companion edit exits 1 with 2 findings over 2
          # clauses, and an undispositioned added clause exits 1 with 1 finding over 1 — each
          # against a real git repository under the OS temp dir, each re-run on every suite run.
          #
          # This step needs the job's `fetch-depth: 0` checkout. See the comment on that setting.
          node scripts/check-diff-disposition.js

          # WHAT IT HOLDS, AND WHAT A RED MEANS. It asserts that NO tracked file contains a control
          # byte other than TAB (0x09) or LINE FEED (0x0a) — that is, none of C0 (0x00-0x1f) outside
          # those two, and not DELETE (0x7f). The class is wider than the one byte the gate is named
          # for: the module was widened to the whole forbidden control-byte class in round 6 (plan
          # 29-45, WR-04) and the module name and package script were deliberately NOT renamed,
          # because renaming a script referenced from here and from package.json would be a second,
          # unrelated change riding on that one. What states the scope instead is the module header
          # and the PASS line, and this comment now agrees with both rather than describing the
          # gate's name. The scanned set is every path `git ls-files` reports — no exemption list,
          # nothing filtered — so a red names a real file and cannot be cleared by narrowing the
          # scan. Fix the FILE.
          #
          # WHY THIS GATE EXISTS AT ALL. Plan 28-08 shipped a NUL into scripts/context-io.test.ts in
          # commit a290ee7: the source read `cells.join(" ")` and the byte between the quotes was
          # 0x00, not 0x20. It survived tsc, the full suite, and all fourteen existing gates, because
          # a NUL inside a string literal is valid TypeScript. It did two things. It made the digest
          # that line computes IRREPRODUCIBLE FROM ITS OWN SOURCE — a reader reconstructing
          # `join(" ")` hashes different bytes — which defeats the one purpose a published digest
          # has. And it silently disabled `grep` over that file: plain `grep` returned ZERO matches
          # for strings that were present, with an exit status indistinguishable from a genuine
          # absence. In a repository whose value proposition is an auditable trail, a byte that makes
          # the trail invisible to the standard search tool is a trace defect.
          #
          # IT WAS LANDED RED ON PURPOSE (D-24) AND AGAINST THE REAL TREE, NOT A FIXTURE — the same
          # standard plan 28-01 set. At commit cd71344 it exited 1 naming the file, the byte offset,
          # the line and the column; after the NUL was corrected to an explicit `\x1f` escape the
          # same command over the same tree exits 0, with the gate byte-unchanged across the
          # transition. The green is a property of the TREE, not of the gate.
          #
          # WIRED HERE **AND** IN package.json, deliberately at both ends, for the reason recorded
          # above the gates before it: freshness:adapters once ran for an entire phase solely as a
          # side effect of a test spawning it.
          node scripts/check-nul-bytes.js
          VALIDATE_KIT_ROOT=. node scripts/validate-agent-factory.js
