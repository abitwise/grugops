# grugops CI — vitest suite + freshness/build gates on an OS matrix.
#
# Created in Phase 20 plan 20-04 (SC-2 Windows proof). RESEARCH flagged a CI workflow as
# [ASSUMED] to exist — it did NOT. This file is created honestly; it does not fake any result.
#
# The windows-latest leg exists for ONE specific reason: to EXECUTE the SC-2
# `unlinkSync`-then-`renameSync` branch in scripts/context-io.ts on a real Windows runner
# (Windows MoveFileEx is not atomic and rejects rename-onto-existing with EPERM/EEXIST/EACCES;
# that branch only runs on Windows). The deterministic unit test in scripts/context-io.test.ts
# carries the logic proof on every OS; this matrix makes the cross-platform claim real, not asserted.
#
# HONESTY CARVE-OUT (no fabrication): a GREEN windows-latest run proves the Windows code branch
# executes and the concurrent-writer/render tests pass on Windows. It does NOT prove atomicity over
# a true network filesystem (NFS/SMB) — that is `UNKNOWN - verify` and is intentionally NOT claimed
# here. The real concurrency oracle is DOGF-02 (Phase 26). Do not read Windows-green as NFS-green.
#
# Node 22 is the documented hard floor (CLAUDE.md / package.json engines `>=22`). The committed
# package-lock.json makes `npm ci` deterministic. Dev deps are typescript/vitest/@types/node only
# (already audited) — this workflow installs NO new package.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (dev deps only — typescript/vitest/@types/node)
        run: npm ci

      - name: Build (tsc → committed .js parity surface)
        run: npm run build

      # (27-60 / WR-04) WIRED HONESTLY, AND THE FINDING IS THAT IT WAS NOT WIRED AT ALL.
      # 27-REVIEW § WR-04 proposed wiring the new test-inclusive target "into the same gate that
      # runs typecheck". There WAS no typecheck step in this workflow — the shipped source got
      # type-checked only as a side effect of `npm run build` (tsc with noEmitOnError), and the
      # TEST files got type-checked by nothing anywhere: tsconfig.json excludes `**/*.test.ts`
      # (measured: `tsc --noEmit --listFiles` loaded ZERO of the 36 tracked .test.ts files) and
      # vitest's transform strips types without checking them.
      #
      # `npm run typecheck` now runs BOTH targets: the shipped-source one (unchanged, exclude list
      # byte-identical) and tsconfig.tests.json, which drops only the test exclusion. It emits
      # nothing, so it cannot perturb the committed .js the freshness gate compares against.
      # Both OS legs run it; it is pure type analysis with no path-separator surface.
      - name: Typecheck (shipped source + test-inclusive target)
        run: npm run typecheck

      # Run the full vitest suite EXCLUDING the live claude-CLI e2e lane (scripts/e2e). That lane
      # spends tokens and can hang on an authed box; it is NOT a CI gate. On windows-latest this is
      # the step that exercises the SC-2 unlink-then-rename branch (paths normalized via node:path).
      - name: Vitest (e2e lane excluded)
        run: npx vitest run --exclude '**/scripts/e2e/**'

      # ubuntu-only: the four freshness gates + the three repo gates. Scoped to one OS to avoid
      # path-separator drift in the freshness diffs; Windows stays scoped to the atomicity proof.
      - name: Freshness gates + repo gates (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run freshness
          npm run freshness:catalog
          npm run freshness:context
          # SPAWN-02 — the gate that makes a hand-edited .claude/agents adapter unrepresentable.
          # It existed and passed for a whole phase while being invoked by nothing, so a committed
          # hand-edit to an adapter cleared every gate in the repository (27-REVIEW CR-01/CR-02).
          npm run freshness:adapters
          # KIT-03 / SPAWN-04 (plan 27-64, D-64 Part B) — the same mechanism, extended to the
          # surface that kept failing. Every bypass reproduced in eleven review rounds landed in a
          # SKILL.md; the seventeen generated-and-byte-gated agent adapters were never bypassed
          # once. The seven standalone skill twins are now generated and byte-gated too, so a
          # hand-edit to one is unrepresentable in a green build. Wired HERE and in
          # scripts/skill-twins-freshness.test.ts, deliberately at both ends — freshness:adapters
          # was un-wired for a whole phase and that was this phase's most expensive omission.
          npm run freshness:skill-twins
          node scripts/check-foundation-guards.js
          # IN-02 (plan 27-23) — WIRED AT BOTH ENDS. Until this line, check-kit-refs and
          # validate-agent-factory ran in continuous integration solely as a SIDE EFFECT of their
          # .test.ts files spawning them inside the vitest step above. That is one --exclude pattern
          # away from being un-gated, and it is exactly the state freshness:adapters was in before
          # plan 27-11 wired it here — minus the missing test, which these two do have. A gate that
          # runs only because some other step happens to run it is not wired; it is borrowed.
          #
          # THE FINDING IS PRE-EXISTING and was scoped into plan 27-23 deliberately. It is not repair
          # of a regression that plan introduced — a later reader should not read these two lines as
          # a fix for something the same diff broke.
          #
          # ROOTS: check-kit-refs resolves its root correctly from the repository root, where this
          # workflow runs (CHECK_ROOT is an override for hermetic mirrors, never a requirement), so
          # it is invoked bare. validate-agent-factory deliberately has NO default for its KIT root
          # — the C3 no-false-green guard makes an unset VALIDATE_KIT_ROOT a hard error rather than a
          # silent '.' fallback — so the value is supplied explicitly here. VALIDATE_ROOT is left
          # unset on purpose and falls back to the repository root, which is the state root of this
          # single-tree checkout.
          node scripts/check-kit-refs.js
          # AUDIT-02 (plan 28-01, D-09) — the THIRD consumer of scripts/dead-vocabulary.ts, sitting
          # beside check-kit-refs on purpose so a reader meets the two consumers of the one
          # retired-vocabulary authority as a pair. check-kit-refs's SCAN deliberately EXCLUDES the
          # user-visible public documents (root README.md, CLAUDE.md, examples/,
          # agent-factory/README.md) under its never-a-repo-wide-grep contract; this gate covers
          # exactly that surface, with its own derived and two-sided-pinned scan set. That contract
          # is untouched — no entry was added to or removed from SCAN or GH_SCAN.
          #
          # WIRED HERE **AND** IN scripts/check-public-docs-vocabulary.test.ts, DELIBERATELY AT BOTH
          # ENDS. This repository shipped freshness:adapters for an entire phase while it ran solely
          # as a side effect of a test spawning it — one --exclude pattern away from being un-gated.
          # A gate that runs only because some other step happens to run it is not wired; it is
          # borrowed.
          #
          # WHAT IT HOLDS, AND WHAT A RED MEANS. It asserts that the ten scanned public documents
          # carry ZERO retired grugops vocabulary, reading the literals from the one authority in
          # scripts/dead-vocabulary.ts. A red here means a document reintroduced a retired path form
          # or a retired prose form — most likely a v1.x description of the deleted handoff relay
          # written back into text a user reads. Fix the DOCUMENT. Do not add an exemption and do not
          # narrow the scan set: PUBLIC_DOCS_SCAN_COUNT is two-sided pinned precisely so removing a
          # member to reach green is not available.
          #
          # It was landed RED on purpose (D-24) and turned GREEN by plan 28-05 — exit 1 with 18 hits
          # across 8 of 10 documents at the commit that introduced it, exit 0 after, with the gate
          # itself byte-unchanged across the transition. That history is why a red here is credible:
          # this guard has been watched catching the exact drift it exists for.
          node scripts/check-public-docs-vocabulary.js
          # AUDIT-01 (plan 28-03, D-03 / D-05) — the disposition-register completeness gate. It
          # sits after the drift guard because both are Phase 28 audit gates and a reader should
          # meet them together, and because this one is the slower of the two to reason about.
          #
          # WHY THIS IS A CHECK AND NOT A CLAIM. Phase 29 declares a dependency on
          # docs/audit/28-disposition-register.md, and a .planning/phases/28-.../ artifact is
          # ARCHIVED at milestone close and invisible to CI — so "the register is complete" written
          # in a planning document is a sentence that stops being true without anything going red.
          # The register is a durable docs/ artifact and this gate holds its completeness here.
          #
          # WIRED HERE **AND** IN scripts/check-audit-register.test.ts, DELIBERATELY AT BOTH ENDS,
          # for the same reason recorded above the public-docs gate: freshness:adapters ran for an
          # entire phase solely as a side effect of a test spawning it.
          #
          # WHAT IT HOLDS, AND WHAT A RED MEANS. Three things, on every run. (1) Every file the
          # derived listers return has a register row, by SET equality in both directions — a red
          # here means a role or workflow was added, removed or renamed without its row, or a row
          # names a file that no longer exists. (2) The findings each row DECLARES equals the Table B
          # rows naming it, per file and in total — a red means a finding was added or deleted
          # without its count. (3) The derived D-18 exclusion list at
          # docs/audit/28-safety-surface-exclusions.md is byte-identical to a fresh regeneration — a
          # red means a `safety_surface` flag or a `kind: safety` claim moved and the list was not
          # rebuilt; run `npm run generate:safety-surface` and commit the result. It also refuses a
          # blank observation, a bare-word observation, a disposition outside the closed set, a
          # deferral with no target phase and a category-6 finding disposed as anything but
          # deferred-to-29.
          #
          # It was landed RED on purpose (D-05, the same argument D-24 makes about the drift guard
          # above) and turned GREEN by the read pass in plans 28-06 and 28-07 — exit 1 with
          # `2 CHECK(S) FAILED` over 37 blank observations at the commit that introduced it, exit 0
          # once all 37 rows were filled. BOTH D-03 equalities were already green at that commit, so
          # the red was precisely the unread files and nothing else. Nothing was loosened and no row
          # was dropped to reach green; the register was filled.
          node scripts/check-audit-register.js
          # AUDIT-03 (plan 28-04, D-16) — the claim-registry anchor gate, third and last of this
          # phase's audit gates, sitting after the register gate so a reader meets all three
          # together.
          #
          # WHAT IT HOLDS. docs/audit/28-claim-registry.md maps every public claim to the safety
          # floor whose lowering would falsify it, and its only consumer is Phase 30's
          # claim-dropping, which voids claims BY ID. PHASE 29 SITS BETWEEN THE TWO AND REWRITES
          # PROSE FOR A LIVING. Without this gate a Phase 29 rewrite silently invalidates the
          # registry: the rows keep parsing, the ids keep resolving, and every one of them points
          # at a sentence that moved or changed. This asserts anchors and rows are a bijection and
          # that each row's text is byte-identical at its anchor.
          #
          # WIRED HERE **AND** IN scripts/check-claim-anchors.test.ts, DELIBERATELY AT BOTH ENDS,
          # for the same reason recorded above the two gates before it: freshness:adapters ran for
          # an entire phase solely as a side effect of a test spawning it.
          #
          # UNLIKE THE OTHER TWO PHASE 28 GATES, THIS ONE IS EXPECTED **GREEN** ON LANDING — the
          # registry was authored against today's text, so there is nothing for it to catch yet.
          # Measured at the commit that introduced it: exit 0, 38 registry rows (37 markdown, 1
          # unanchorable), 37 verbatim comparisons, all 4 safety floors mapped.
          #
          # IT IS EXPECTED TO GO **RED INSIDE PLAN 28-05** if that plan rewrites an anchored
          # sentence without updating its row in the same commit. That is not breakage; it is the
          # mechanism D-25 relies on, demonstrated on a real commit rather than on a fixture. Six
          # rows ship `status: false` and eight ship `status: overstated` precisely so that trail
          # exists.
          node scripts/check-claim-anchors.js

          # WHAT IT HOLDS, AND WHAT A RED MEANS. It asserts that ZERO tracked files carry a NUL
          # (0x00) byte. The scanned set is every path `git ls-files` reports — no exemption list,
          # nothing filtered — so a red names a real file and cannot be cleared by narrowing the
          # scan. Fix the FILE.
          #
          # WHY THIS GATE EXISTS AT ALL. Plan 28-08 shipped a NUL into scripts/context-io.test.ts in
          # commit a290ee7: the source read `cells.join(" ")` and the byte between the quotes was
          # 0x00, not 0x20. It survived tsc, the full suite, and all fourteen existing gates, because
          # a NUL inside a string literal is valid TypeScript. It did two things. It made the digest
          # that line computes IRREPRODUCIBLE FROM ITS OWN SOURCE — a reader reconstructing
          # `join(" ")` hashes different bytes — which defeats the one purpose a published digest
          # has. And it silently disabled `grep` over that file: plain `grep` returned ZERO matches
          # for strings that were present, with an exit status indistinguishable from a genuine
          # absence. In a repository whose value proposition is an auditable trail, a byte that makes
          # the trail invisible to the standard search tool is a trace defect.
          #
          # IT WAS LANDED RED ON PURPOSE (D-24) AND AGAINST THE REAL TREE, NOT A FIXTURE — the same
          # standard plan 28-01 set. At commit cd71344 it exited 1 naming the file, the byte offset,
          # the line and the column; after the NUL was corrected to an explicit `\x1f` escape the
          # same command over the same tree exits 0, with the gate byte-unchanged across the
          # transition. The green is a property of the TREE, not of the gate.
          #
          # WIRED HERE **AND** IN package.json, deliberately at both ends, for the reason recorded
          # above the gates before it: freshness:adapters once ran for an entire phase solely as a
          # side effect of a test spawning it.
          node scripts/check-nul-bytes.js
          VALIDATE_KIT_ROOT=. node scripts/validate-agent-factory.js
