# grugops CI — vitest suite + freshness/build gates on an OS matrix.
#
# Created in Phase 20 plan 20-04 (SC-2 Windows proof). RESEARCH flagged a CI workflow as
# [ASSUMED] to exist — it did NOT. This file is created honestly; it does not fake any result.
#
# The windows-latest leg exists for ONE specific reason: to EXECUTE the SC-2
# `unlinkSync`-then-`renameSync` branch in scripts/context-io.ts on a real Windows runner
# (Windows MoveFileEx is not atomic and rejects rename-onto-existing with EPERM/EEXIST/EACCES;
# that branch only runs on Windows). The deterministic unit test in scripts/context-io.test.ts
# carries the logic proof on every OS; this matrix makes the cross-platform claim real, not asserted.
#
# HONESTY CARVE-OUT (no fabrication): a GREEN windows-latest run proves the Windows code branch
# executes and the concurrent-writer/render tests pass on Windows. It does NOT prove atomicity over
# a true network filesystem (NFS/SMB) — that is `UNKNOWN - verify` and is intentionally NOT claimed
# here. The real concurrency oracle is DOGF-02 (Phase 26). Do not read Windows-green as NFS-green.
#
# Node 22 is the documented hard floor (CLAUDE.md / package.json engines `>=22`). The committed
# package-lock.json makes `npm ci` deterministic. Dev deps are typescript/vitest/@types/node only
# (already audited) — this workflow installs NO new package.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (dev deps only — typescript/vitest/@types/node)
        run: npm ci

      - name: Build (tsc → committed .js parity surface)
        run: npm run build

      # (27-60 / WR-04) WIRED HONESTLY, AND THE FINDING IS THAT IT WAS NOT WIRED AT ALL.
      # 27-REVIEW § WR-04 proposed wiring the new test-inclusive target "into the same gate that
      # runs typecheck". There WAS no typecheck step in this workflow — the shipped source got
      # type-checked only as a side effect of `npm run build` (tsc with noEmitOnError), and the
      # TEST files got type-checked by nothing anywhere: tsconfig.json excludes `**/*.test.ts`
      # (measured: `tsc --noEmit --listFiles` loaded ZERO of the 36 tracked .test.ts files) and
      # vitest's transform strips types without checking them.
      #
      # `npm run typecheck` now runs BOTH targets: the shipped-source one (unchanged, exclude list
      # byte-identical) and tsconfig.tests.json, which drops only the test exclusion. It emits
      # nothing, so it cannot perturb the committed .js the freshness gate compares against.
      # Both OS legs run it; it is pure type analysis with no path-separator surface.
      - name: Typecheck (shipped source + test-inclusive target)
        run: npm run typecheck

      # Run the full vitest suite EXCLUDING the live claude-CLI e2e lane (scripts/e2e). That lane
      # spends tokens and can hang on an authed box; it is NOT a CI gate. On windows-latest this is
      # the step that exercises the SC-2 unlink-then-rename branch (paths normalized via node:path).
      - name: Vitest (e2e lane excluded)
        run: npx vitest run --exclude '**/scripts/e2e/**'

      # ubuntu-only: the four freshness gates + the three repo gates. Scoped to one OS to avoid
      # path-separator drift in the freshness diffs; Windows stays scoped to the atomicity proof.
      - name: Freshness gates + repo gates (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run freshness
          npm run freshness:catalog
          npm run freshness:context
          # SPAWN-02 — the gate that makes a hand-edited .claude/agents adapter unrepresentable.
          # It existed and passed for a whole phase while being invoked by nothing, so a committed
          # hand-edit to an adapter cleared every gate in the repository (27-REVIEW CR-01/CR-02).
          npm run freshness:adapters
          # KIT-03 / SPAWN-04 (plan 27-64, D-64 Part B) — the same mechanism, extended to the
          # surface that kept failing. Every bypass reproduced in eleven review rounds landed in a
          # SKILL.md; the seventeen generated-and-byte-gated agent adapters were never bypassed
          # once. The seven standalone skill twins are now generated and byte-gated too, so a
          # hand-edit to one is unrepresentable in a green build. Wired HERE and in
          # scripts/skill-twins-freshness.test.ts, deliberately at both ends — freshness:adapters
          # was un-wired for a whole phase and that was this phase's most expensive omission.
          npm run freshness:skill-twins
          node scripts/check-foundation-guards.js
          # IN-02 (plan 27-23) — WIRED AT BOTH ENDS. Until this line, check-kit-refs and
          # validate-agent-factory ran in continuous integration solely as a SIDE EFFECT of their
          # .test.ts files spawning them inside the vitest step above. That is one --exclude pattern
          # away from being un-gated, and it is exactly the state freshness:adapters was in before
          # plan 27-11 wired it here — minus the missing test, which these two do have. A gate that
          # runs only because some other step happens to run it is not wired; it is borrowed.
          #
          # THE FINDING IS PRE-EXISTING and was scoped into plan 27-23 deliberately. It is not repair
          # of a regression that plan introduced — a later reader should not read these two lines as
          # a fix for something the same diff broke.
          #
          # ROOTS: check-kit-refs resolves its root correctly from the repository root, where this
          # workflow runs (CHECK_ROOT is an override for hermetic mirrors, never a requirement), so
          # it is invoked bare. validate-agent-factory deliberately has NO default for its KIT root
          # — the C3 no-false-green guard makes an unset VALIDATE_KIT_ROOT a hard error rather than a
          # silent '.' fallback — so the value is supplied explicitly here. VALIDATE_ROOT is left
          # unset on purpose and falls back to the repository root, which is the state root of this
          # single-tree checkout.
          node scripts/check-kit-refs.js
          # AUDIT-02 (plan 28-01, D-09) — the THIRD consumer of scripts/dead-vocabulary.ts, sitting
          # beside check-kit-refs on purpose so a reader meets the two consumers of the one
          # retired-vocabulary authority as a pair. check-kit-refs's SCAN deliberately EXCLUDES the
          # user-visible public documents (root README.md, CLAUDE.md, examples/,
          # agent-factory/README.md) under its never-a-repo-wide-grep contract; this gate covers
          # exactly that surface, with its own derived and two-sided-pinned scan set. That contract
          # is untouched — no entry was added to or removed from SCAN or GH_SCAN.
          #
          # WIRED HERE **AND** IN scripts/check-public-docs-vocabulary.test.ts, DELIBERATELY AT BOTH
          # ENDS. This repository shipped freshness:adapters for an entire phase while it ran solely
          # as a side effect of a test spawning it — one --exclude pattern away from being un-gated.
          # A gate that runs only because some other step happens to run it is not wired; it is
          # borrowed.
          #
          # THIS GATE IS **EXPECTED TO FAIL RED** UNTIL THE AUDIT-02 DRIFT FIXES LAND IN PLAN 28-05.
          # That is deliberate, and it is the ACCEPTANCE EVIDENCE for D-24, not a regression: a guard
          # that passes the moment it appears has never been watched fail, so its ability to catch
          # this drift would be asserted rather than demonstrated. Measured at the commit that
          # introduced it: exit 1, 18 hits across 8 of the 10 scanned documents. If you are reading
          # this beside a red build, check whether 28-05 has landed before treating it as breakage.
          node scripts/check-public-docs-vocabulary.js
          VALIDATE_KIT_ROOT=. node scripts/validate-agent-factory.js
